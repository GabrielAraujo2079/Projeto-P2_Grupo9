<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/buy.css">

    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
        rel="stylesheet">

    <title>Detalhes do Veículo</title>
</head>

<body>

    <header class="header">
        <a href="../index.html">
            <img class="icon_logo"
                src="../assets/icons/ui/logo-autoPrime.png"
                alt="Logo Auto Prime">
        </a>
    </header>

    <main class="buy-container">

        <section class="buy-card">

            <!-- IMAGEM -->
            <div class="buy-image">
                <img id="carImage"
                    src="../assets/images/vehicles/honda-civic.jpg"
                    alt="Veículo">
            </div>

            <!-- INFORMAÇÕES -->
            <div class="buy-info">

                <h1 id="carName">Honda Civic Touring</h1>

                <p class="buy-price">
                    R$ <span id="carPrice">89.900,00</span>
                </p>

                <!-- ESPECIFICAÇÕES -->
                <div class="specs">

                    <h2>Especificações</h2>

                    <div class="spec-grid">

                        <div class="spec-item">
                            <span>Motor</span>
                            <strong id="motorValue">2.0 Flex</strong>
                        </div>

                        <div class="spec-item">
                            <span>Câmbio</span>
                            <strong id="cambioValue">Automático CVT</strong>
                        </div>

                        <div class="spec-item">
                            <span>Ano</span>
                            <strong id="anoValue">2023</strong>
                        </div>

                        <div class="spec-item">
                            <span>Quilometragem</span>
                            <strong id="kmValue">18.000 km</strong>
                        </div>

                        <div class="spec-item">
                            <span>Potência</span>
                            <strong id="potenciaValue">155cv</strong>
                        </div>

                        <div class="spec-item">
                            <span>Combustível</span>
                            <strong id="combustivelValue">Flex</strong>
                        </div>

                    </div>

                </div>

                <!-- PARCELAMENTO -->
                <div class="payment-section">

                    <h2>Formas de pagamento</h2>
                    <label class="payment-option">
                        <input type="radio" name="payment" value="avista">
                        <span>À vista</span>
                    </label>

                    <label class="payment-option">
                        <input type="radio" name="payment" value="12x">
                        <span>12x de R$ 7.491 sem juros</span>
                    </label>

                    <label class="payment-option">
                        <input type="radio" name="payment" value="24x">
                        <span>24x de R$ 4.120</span>
                    </label>

                    <label class="payment-option">
                        <input type="radio" name="payment" value="48x">
                        <span>48x de R$ 2.390</span>
                    </label>

                </div>

                <!-- BOTÃO -->
                <button class="btn-buy" onclick="confirmarCompra()">
                    Confirmar Compra
                </button>

                <p id="mensagemCompra" class="success-message"></p>

            </div>

        </section>

    </main>

    <script src="../js/buy.js"></script>

</body>

</html>
