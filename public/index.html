<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!--Link do css usado em todas as pags-->
    <link rel="stylesheet" href="css/global.css">

    <!--Link do css proprio da pag-->
    <link rel="stylesheet" href="css/home.css">
    <!--Link da fonte de texto usada (Roboto) -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">

    <title>Auto Prime</title>
</head>

<body>
    <header class="header">
        <a href="index.html">
            <img class="icon_logo" src="" alt="Logo Auto Prime">
        </a>
        <a href="login.html">
            <img class="img_icon" src="assets/icons/user_icon.png" alt="Logar">
        </a>
    </header>
    <div class="page">
        <aside class="sidebar">

            <h2>Filtros Gerais</h2>

            <!-- Seção Câmbio -->
            <section class="filtro-section">
                <h3>Câmbio</h3>
                <label class="checkbox-item">
                    <input type="checkbox" value="manual"> Manual
                </label>
                <label class="checkbox-item">
                    <input type="checkbox" value="automatico"> Automático
                </label>

            </section>
            <hr>
            <!-- Seção Estado de uso -->
            <section class="filtro-section">
                <h3>Estado de uso</h3>
                <label class="toggle-item">
                    <span>Novos</span>
                    <div class="toggle">
                        <input type="checkbox" value="novo">
                        <span class="toggle-slider"></span>
                    </div>
                </label>

                <label class="toggle-item">
                    <span>Usados</span>
                    <div class="toggle">
                        <input type="checkbox" value="usado">
                        <span class="toggle-slider"></span>
                    </div>
                </label>

            </section>

            <hr>

            <!-- Seção Marca -->
            <section class="filtro-section">
                <h3>Marca</h3>
                <div class="marcas-grid">
                    <div class="marca-item">
                        <img src="assets/icons/chevrolet.png" alt="Chevrolet">
                        <span>Chevrolet</span>
                    </div>
                    <div class="marca-item">
                        <img src="assets/icons/honda.png" alt="Honda">
                        <span>Honda</span>
                    </div>
                    <div class="marca-item">
                        <img src="assets/icons/fiat.png" alt="Fiat">
                        <span>Fiat</span>
                    </div>
                    <div class="marca-item">
                        <img src="assets/icons/volkswagen.png" alt="Volkswagen">
                        <span>Volkswagen</span>
                    </div>
                    <div class="marca-item">
                        <img src="assets/icons/renault.png" alt="Renault">
                        <span>Renault</span>
                    </div>
                    <div class="marca-item">
                        <img src="assets/icons/peugeot.png" alt="Peugeot">
                        <span>Peugeot</span>
                    </div>
                    <div class="marca-item">
                        <img src="assets/icons/citroen.png" alt="Citroen">
                        <span>Citroen</span>
                    </div>
                    <div class="marca-item">
                        <img src="assets/icons/ford.png" alt="Ford">
                        <span>Ford</span>
                    </div>
                    <div class="marca-item">
                        <img src="assets/icons/hyundai.png" alt="Hyundai">
                        <span>Hyundai</span>
                    </div>
                </div>
            </section>

        </aside>
        <main class="content"> <!--Conteudo principal-->

        </main>
    </div>

</body>

</html>
